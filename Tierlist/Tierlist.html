<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tier List Maker</title>
  <link rel="stylesheet" href="CSS/TierlistBG.css">
  <script src="JavaScript/dom-to-image.min.js" defer></script>
  <script src="JavaScript/TierlistNames.js" defer></script>
</head>
<body>
  <main class="tierlist">
    <div class="tl-header">
      <h1>Tier List</h1>
      <button id="refresh-tier-list" type="button" class="tl-btn tl-btn-danger">Refresh Tier List</button>
    </div>

    <div class="title-edit-container">
      <label for="title-input">Title:</label>
      <input type="text" id="title-input" placeholder="Tier List" value="Tier List">
    </div>

    <p class="tl-intro">Drag images into a tier. Click images then drag selected image to move them.</p>

    <section id="tiers" aria-label="Tier list"></section>

    <div class="tier-toolbar">
      <button type="button" id="add-tier-btn" class="tl-btn tl-btn-accent">+ Add tier</button>
    </div>

    <div class="selection-controls">
      <select id="target-tier-select" aria-label="Move selected images to"></select>
      <button id="select-all-btn" class="tl-btn">Select All Unsorted</button>
      <button id="select-everything-btn" class="tl-btn">Select Everything</button>
      <button id="move-selected-btn" class="tl-btn tl-btn-primary" disabled>Move Selected</button>
      <button id="remove-selected-btn" class="tl-btn tl-btn-danger" disabled>Remove Selected</button>
      <button id="deselect-all-btn" class="tl-btn">Clear Selection</button>
    </div>

    <section class="game-bank" aria-label="Unsorted images">
      <div class="bank-title">Unsorted images</div>

      <div class="bank-content">
        <div class="bank-items dropzone" id="game-bank"></div>

        <div class="upload-panel">
          <input
            id="game-name-input"
            type="text"
            placeholder="Name (optional)"
            aria-label="Name"
          >

          <label id="image-drop-area" for="image-file-input">
            Drop images here or click to browse
            <input
              id="image-file-input"
              type="file"
              accept="image/*"
              multiple
            >
          </label>

          <form id="add-game-form">
            <input
              id="game-image-url"
              type="url"
              placeholder="Or paste an image URL"
              aria-label="Image URL"
            >
            <button type="submit" class="tl-btn tl-btn-primary">Add by URL</button>
          </form>
        </div>
      </div>
    </section>

    <div class="tl-footer">
      <label class="names-toggle">
        <input type="checkbox" id="toggle-names">
        Show names
      </label>

      <div class="tl-presets">
        <button id="save-tiers-preset" type="button" class="tl-download-btn">
          Create preset: images in tiers
        </button>
        <button id="save-unsorted-preset" type="button" class="tl-download-btn">
          Create preset: unsorted images
        </button>
        <button id="load-preset" type="button" class="tl-download-btn">
          Load preset
        </button>
        <input id="preset-file-input" type="file" accept=".json,application/json" hidden>
      </div>

      <button id="download-png" type="button">
        Download the page as a PNG
      </button>
    </div>
  </main>
</body>
</html>
